<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515"><title>VERIS — Assistente</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#151515;--fg:#f5f5f6;--muted:#a1a1a9}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid #c89bff;outline-offset:3px}.app{height:100dvh;min-height:460px;display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden}.glow{position:absolute;pointer-events:none;z-index:-1;bottom:-140px;left:50%;transform:translateX(-50%);width:min(1300px,170vw);height:440px;background:radial-gradient(ellipse at 50% 95%,#9e5fdc72 0%,#803c9a46 23%,#6c3c7c22 46%,transparent 72%);mask-image:linear-gradient(to top,#000 0%,#000 48%,transparent 100%)}.glow:after{content:"";position:absolute;inset:25% 0 0;background-image:radial-gradient(circle,#e4a8ffb0 1px,transparent 1.6px);background-size:14px 14px;opacity:.26;transform:perspective(330px) rotateX(45deg);mask-image:linear-gradient(to top,#000,transparent 85%)}.header{height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(17px,4vw,46px);gap:14px;flex-shrink:0}.left,.right{display:flex;align-items:center;gap:15px}.circle{width:47px;height:47px;border:1px solid #3b3b40;background:#242426;border-radius:50%;color:#e8e8ed;display:grid;place-items:center;font-size:24px}.circle:hover{background:#323237}.brand{font-size:21px;letter-spacing:.005em;font-weight:600}.brand span{color:#9998a1;font-weight:400}.module{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#eaeaf0;padding:9px 2px;font-size:17px}.chevron{font-size:13px;color:#b4b3bb}.menu{position:absolute;top:75px;left:clamp(17px,4vw,46px);width:min(325px,calc(100vw - 34px));background:#27272b;border:1px solid #48454d;border-radius:19px;padding:9px;z-index:6;box-shadow:0 22px 55px #0008}.menu button{display:block;width:100%;padding:14px;text-align:left;border:0;border-radius:11px;background:transparent;color:#f2f0f7}.menu button:hover:not(:disabled){background:#3a3640}.menu button:disabled{opacity:.45;cursor:not-allowed}.menu small{display:block;color:#a9a3b2;margin-top:5px}.hidden{display:none!important}.content{width:min(860px,100%);margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;padding:0 22px}.welcome{margin:auto;text-align:center;transform:translateY(-10%)}.mark{font-size:43px;color:#e8b6ff;text-shadow:0 0 35px #ae58db90}.welcome h1{font-weight:500;font-size:clamp(26px,5vw,38px);margin:18px 0 9px}.welcome p{font-size:15px;color:#a4a0ac;line-height:1.65;max-width:450px;margin:auto}.suggestions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:26px}.suggestions button{border:1px solid #39343d;border-radius:99px;background:#27242b;color:#ddd4e6;padding:11px 15px;font-size:13px}.suggestions button:hover{background:#3a3040}.chat{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:20px;padding:16px 4px 24px;scrollbar-width:thin;scrollbar-color:#51465b transparent}.chat:empty{display:none}.bubble{max-width:88%;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}.user{align-self:flex-end;background:#303035;border-radius:23px;padding:13px 18px}.assistant{align-self:flex-start;padding:8px 2px 8px 14px;border-left:2px solid #bb8dd3}.meta{font-size:11px;color:#b59cc4;margin-top:12px}.bottom{width:min(860px,100%);margin:0 auto;padding:0 22px max(15px,env(safe-area-inset-bottom));flex-shrink:0}.composer{border:1px solid #343038;background:#272529;border-radius:35px;min-height:76px;display:flex;align-items:center;padding:9px 11px;gap:7px;box-shadow:0 8px 34px #0005}.composer textarea{flex:1;min-width:0;min-height:47px;max-height:140px;padding:13px 10px;background:transparent;border:0;outline:0;color:#f5f3f7;resize:none;font-size:16px;line-height:1.4}.composer textarea::placeholder{color:#aaa4ae}.action{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;font-size:24px;background:transparent;color:#e8e2eb;flex-shrink:0}.send{background:#7754ba;color:white}.send:disabled{opacity:.45}.note{text-align:center;color:#8c858f;font-size:11px;margin:12px 0 0}.status{font-size:12px;color:#bcb5c2}.status:before{content:"";display:inline-block;width:7px;height:7px;background:#81d9b1;border-radius:50%;margin-right:7px}.status.off:before{background:#e2a278}@media(max-width:600px){.header{height:82px;padding:0 20px}.left,.right{gap:12px}.circle{width:46px;height:46px}.brand{font-size:18px}.module{font-size:16px}.content{padding:0 20px}.bottom{padding:0 15px max(14px,env(safe-area-inset-bottom))}.composer{min-height:72px}.welcome{transform:translateY(-5%)}.suggestions{max-width:340px;margin:24px auto 0}.note{font-size:10px}.glow{bottom:-170px}}
@media(prefers-reduced-motion:no-preference){.glow{animation:breathe 8s ease-in-out infinite alternate}@keyframes breathe{to{opacity:.7;transform:translateX(-50%) scale(1.07)}}}
</style></head><body><div class="app"><div class="glow" aria-hidden="true"></div><header class="header"><div class="left"><button class="circle" id="menuButton" aria-label="Abrir menu" aria-expanded="false">☰</button><button class="module" id="moduleButton" aria-expanded="false"><span class="brand">VERIS <span>4X4</span></span><span class="chevron">⌄</span></button></div><div class="right"><span id="status" class="status">Verificando</span><button class="circle" id="newChat" aria-label="Nova conversa" title="Nova conversa">✎</button></div></header><nav class="menu hidden" id="menu" aria-label="Módulos"><button id="menuNew">＋ Nova conversa</button><button id="menu4x4">◆ VERIS 4X4<small>Conhecimento off-road e Trilha 4X4</small></button><button disabled>◇ VERIS Tech<small>Em desenvolvimento</small></button><button disabled>◇ VERIS Business<small>Em desenvolvimento</small></button><button disabled>✚ Primeiros socorros<small>Aguardando revisão profissional</small></button></nav><section class="content"><div class="welcome" id="welcome"><div class="mark">✦</div><h1>Como posso ajudar?</h1><p>Sua inteligência para explorar conhecimentos sobre trilhas, veículos e o aplicativo Trilha 4X4.</p><div class="suggestions"><button data-q="O que fazer se o veículo atolar na lama?">Veículo atolado</button><button data-q="Como funciona o percurso offline no Trilha 4X4?">Percurso offline</button><button data-q="Como usar um guincho com segurança?">Recuperação com guincho</button></div></div><section class="chat" id="chat" aria-live="polite" aria-label="Conversa"></section></section><footer class="bottom"><form class="composer" id="form"><button class="action" type="button" id="clear" title="Nova conversa" aria-label="Nova conversa">＋</button><textarea id="question" maxlength="2000" rows="1" placeholder="Pergunte à VERIS" aria-label="Sua pergunta" required></textarea><button class="action send" id="send" type="submit" aria-label="Enviar">↑</button></form><p class="note">Base de conhecimento em desenvolvimento. Em emergências, procure socorro profissional.</p></footer></div><script>
const el=id=>document.getElementById(id),chat=el('chat');let busy=false;
function toggleMenu(force){const open=force===undefined?el('menu').classList.contains('hidden'):force;el('menu').classList.toggle('hidden',!open);el('menuButton').setAttribute('aria-expanded',String(open));el('moduleButton').setAttribute('aria-expanded',String(open))}
el('menuButton').onclick=()=>toggleMenu();el('moduleButton').onclick=()=>toggleMenu();el('menu4x4').onclick=()=>toggleMenu(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleMenu(false)});
function reset(){chat.replaceChildren();el('welcome').classList.remove('hidden');el('question').value='';toggleMenu(false);el('question').focus()}
el('newChat').onclick=reset;el('menuNew').onclick=reset;el('clear').onclick=reset;
function bubble(text,role){const div=document.createElement('div');div.className='bubble '+role;div.textContent=text;chat.appendChild(div);chat.scrollTop=chat.scrollHeight;return div}
async function ask(question){question=question.trim();if(!question||busy)return;busy=true;el('send').disabled=true;el('welcome').classList.add('hidden');el('question').value='';bubble(question,'user');const pending=bubble('Consultando a base…','assistant');try{const response=await fetch('/ui/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question})});const data=await response.json();pending.textContent=response.ok?data.answer:(data.error||'Não foi possível responder.');if(response.ok){const meta=document.createElement('div');meta.className='meta';meta.textContent=data.mode==='model'?'Modelo externo':data.needs_review?'Resposta ainda não validada':'Base de conhecimento confirmada';pending.appendChild(meta)}}catch{pending.textContent='Falha de conexão. Verifique se a VERIS está funcionando.'}finally{busy=false;el('send').disabled=false;el('question').focus();chat.scrollTop=chat.scrollHeight}}
el('form').onsubmit=e=>{e.preventDefault();ask(el('question').value)};el('question').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(el('question').value)}};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
fetch('/health').then(r=>{if(!r.ok)throw Error();el('status').textContent='Online'}).catch(()=>{el('status').textContent='Offline';el('status').classList.add('off')});
</script></body></html>
