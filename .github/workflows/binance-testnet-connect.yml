name: Binance Spot Testnet - conexao segura
on:
  workflow_dispatch:
jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
      BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar endpoint publico da Testnet
        run: python -m unittest tests.test_testnet_connectivity -v
      - name: Validar credenciais e consultar saldo ficticio
        if: ${{ env.BINANCE_TESTNET_API_KEY != '' && env.BINANCE_TESTNET_API_SECRET != '' }}
        run: python testnet_connect.py
      - name: Orientar configuracao das credenciais
        if: ${{ env.BINANCE_TESTNET_API_KEY == '' || env.BINANCE_TESTNET_API_SECRET == '' }}
        run: echo "::notice::Configure BINANCE_TESTNET_API_KEY e BINANCE_TESTNET_API_SECRET em Settings > Secrets and variables > Actions. Nenhuma ordem foi enviada."
