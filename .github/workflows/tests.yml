name: Testes robos cripto
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar ambiente
        run: python --version
      - name: Compilar fontes Python
        run: python -m compileall -q autonomous.py trader tests
      - name: Executar testes
        run: python -m unittest discover -s tests -v
